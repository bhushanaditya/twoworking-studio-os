<!DOCTYPE html>
<html lang="en">
<head>
<!-- Tells the browser to start connecting to Firebase's servers right
     away, in parallel with everything else, instead of waiting until the
     scripts below are actually reached. Shaves real time off first load. -->
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<!-- Shared design tokens (colors, spacing, radii) — same file person.html
     uses, so the two pages can never quietly drift apart on a color or
     spacing value. See tokens.css for the full list. -->
<link rel="stylesheet" href="./tokens.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio OS — Home (preview)</title>
<style>
  /* ============ REAL FONT ============ */
  @font-face {
    font-family: "Facade Sud";
    src: url("./assets/Facade-Sud.woff") format("woff"),
         url("./assets/Facade-Sud.otf") format("opentype");
    font-display: swap;
  }

  /* Design tokens (colors, spacing, radii) now live in tokens.css, linked
     in <head> above — not redefined here. */

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg-surface);
    color: var(--color-text-primary);
    font-family: 'Open Sans', sans-serif;
    /* Stops the "rubber-band" bounce past the top/bottom edge on
       trackpads/phones — the page just stops at its real edges instead of
       overscrolling and springing back. */
    overscroll-behavior: none;
  }
  body { min-height: 100vh; }

  .display {
    font-family: "Facade Sud", sans-serif;
    font-weight: 400;
    line-height: 1;
  }

  /* Full-height frame. The vertical guide lines sit INSET by --spacing-lg
     from each edge (confirmed against Figma: guides are at x=20/490 inside
     a 511-wide frame) — not at the true outer edge. Card/goal-card borders
     are padded by the same --spacing-lg, so they land exactly on these
     lines. Only the top-bar divider runs fully edge-to-edge. */
  .app-frame {
    position: relative;
    max-width: var(--content-max);
    margin: 0 auto;
    width: 100%;
    min-height: 100vh;
  }
  .app-frame::before,
  .app-frame::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--color-border-default);
  }
  .app-frame::before { left: var(--spacing-lg); }
  .app-frame::after { right: var(--spacing-lg); }

  .page {
    width: 100%;
  }

  /* ============ TOP BAR ============
     Matches Figma: this divider ignores the guide inset and runs the full
     width of the browser window, even though .top-bar itself stays inside
     .app-frame (so the vertical guide lines still pass through the header,
     same as before). "Break out" of the max-width parent with the classic
     100vw + negative-margin trick. */
  .top-bar {
    padding-top: clamp(14px, 2vw, 20px);
    padding-bottom: clamp(14px, 2vw, 20px);
    display: flex;
    justify-content: center;
    border-bottom: 1px solid var(--color-border-default);
    width: 100vw;
    position: relative;
    left: 50%;
    margin-left: -50vw;
  }
  .logo { width: clamp(40px, 3vw, 52px); }
  .logo svg { display: block; width: 100%; height: auto; }

  /* ============ GOAL CARD ============
     Matches Figma exactly: the card frame itself spans full width (no
     horizontal padding), the top divider is inset by --spacing-lg on each
     side (landing on the guide lines), the text content is inset the same
     amount, and the bottom divider matches. */
  /* First inset layer: lands the whole card + both dividers exactly on
     the guide lines, same as .people-list does for the cards below. */
  .goal-card {
    padding: var(--spacing-xl) var(--spacing-lg) 0;
  }
  .goal-divider {
    height: 1px;
    background: var(--color-border-default);
  }
  /* Second inset layer: extra breathing room past the guide line, same
     amount as .person-card's own padding gives NABH/AVI/ADI. */
  .goal-card-inner {
    padding: var(--spacing-md) var(--spacing-lg) var(--spacing-xl);
  }
  .goal-header {
    display: flex;
    align-items: flex-end;
    gap: var(--spacing-xs);
    flex-wrap: wrap;
  }
  .goal-title {
    margin: 0;
    font-size: clamp(30px, 4.2vw, 48px);
    letter-spacing: 0.5px;
  }
  .goal-amount-row {
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-sm);
  }
  .goal-amount {
    margin: 0;
    font-weight: 300;
    font-size: clamp(16px, 1.6vw, 20px);
  }
  .goal-edit-btn {
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--color-accent-primary);
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .goal-edit-btn[hidden] { display: none; } /* [hidden] must win over display:flex above */
  .goal-edit-btn svg { width: 15px; height: 15px; }
  .goal-amount-input {
    margin: 0;
    font-family: 'Open Sans', sans-serif;
    font-weight: 300;
    font-size: clamp(16px, 1.6vw, 20px);
    color: var(--color-text-primary);
    background: none;
    border: none;
    border-bottom: 1px solid var(--color-accent-primary);
    padding: 0 0 2px;
    width: 100%;
    max-width: 320px;
  }
  .goal-amount-input:focus { outline: none; }

  /* ============ PEOPLE LIST ============ */
  .people-list {
    display: grid;
    grid-template-columns: 1fr;
    padding: 0 var(--spacing-lg);
    margin-top: var(--spacing-3xl);
    gap: var(--spacing-lg);
    padding-bottom: var(--spacing-3xl);
  }
  @media (min-width: 760px) {
    .people-list { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1080px) {
    .people-list { grid-template-columns: repeat(3, 1fr); }
    /* 3-up on desktop means each card is much narrower than the mobile
       design assumed — shrink the streak dots so 10-per-row still reads
       comfortably instead of feeling oversized/cramped. */
    .streak-dot { width: 16px; height: 16px; }
  }

  .person-card {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--color-text-primary);
    padding: var(--spacing-lg);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }
  .person-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-right: var(--spacing-sm);
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    width: 100%;
    text-align: left;
    font: inherit;
  }
  .person-name {
    margin: 0;
    font-size: clamp(30px, 3.4vw, 44px);
    letter-spacing: 0.5px;
  }
  .chevron {
    width: 18px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-accent-primary);
    flex-shrink: 0;
  }
  .chevron svg { width: 18px; height: 34px; }

  .streak-grid {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-sm);
  }
  .streak-dot {
    width: clamp(16px, 1.9vw, 23.84px);
    height: clamp(16px, 1.9vw, 23.84px);
    border-radius: 50%;
    border: 0.6px solid var(--color-border-default);
    flex-shrink: 0;
  }
  .streak-dot.filled { background: var(--color-accent-primary); }
  .streak-dot.empty { background: var(--color-bg-surface); }

  /* Today's log entry (if any) shown under a person's streak — quotes
     whatever they actually typed into LOG TODAY on their own page. Hidden
     entirely (via :empty) if they haven't logged anything yet today. */
  .person-status {
    margin: 0;
    font-family: 'Open Sans', sans-serif;
    font-weight: 300;
    font-style: italic;
    font-size: 14px;
    opacity: 0.85;
  }
  .person-status:empty { display: none; }
  .person-status::before { content: '"'; }
  .person-status::after { content: '"'; }

  /* ============ GOAL PROGRESS (5 eyes) ============
     Same eye-shape iconography as the state icons on the Person page —
     empty (outline) or filled (glowing), just reused here as a simple
     5-step progress tracker for the monthly goal. Each eye toggles on its
     own between empty/filled; how many are filled is "how much we've hit
     the goal this month." */
  .goal-progress {
    display: flex;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-md);
    flex-wrap: wrap;
  }
  .goal-eye {
    width: clamp(32px, 4vw, 44px);
    height: clamp(17px, 2.2vw, 24px);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
  }
  .goal-eye svg { width: 100%; height: 100%; display: block; }

  /* ============ PIN GATE ============
     Covers the whole screen until the right PIN is entered. The app
     underneath is hidden (not just covered) until `body` gets the
     `.authed` class, which auth-gate.js adds once Firebase confirms you're
     signed in. */
  body:not(.authed) .app-frame { visibility: hidden; }
  #pinGate {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--color-bg-surface);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.authed #pinGate { display: none; }
  /* Hidden until we actually know you're logged out — avoids a flash of
     the PIN form on pages you already had access to (see auth-gate.js). */
  .pin-gate-inner { display: none; }
  body.authChecked:not(.authed) .pin-gate-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-md);
    width: min(90%, 320px);
    padding: var(--spacing-xl);
  }
  .pin-gate-title {
    margin: 0;
    font-size: 36px;
    letter-spacing: 0.5px;
  }
  .pin-gate-label {
    margin: 0;
    font-family: 'Open Sans', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .pin-gate-input {
    width: 100%;
    text-align: center;
    letter-spacing: 10px;
    font-size: 24px;
    padding: var(--spacing-md);
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--color-border-default);
    color: var(--color-text-primary);
    font-family: 'Open Sans', sans-serif;
  }
  .pin-gate-input:focus { outline: none; border-color: var(--color-accent-primary); }
  .pin-gate-btn {
    width: 100%;
    padding: var(--spacing-md);
    background: var(--color-accent-primary);
    color: var(--color-text-on-accent);
    border: none;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .pin-gate-btn:disabled { opacity: 0.5; cursor: default; }
  .pin-gate-error {
    margin: 0;
    min-height: 16px;
    color: var(--color-danger);
    font-family: 'Open Sans', sans-serif;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="pinGate">
    <div class="pin-gate-inner">
      <h1 class="display pin-gate-title">STUDIO OS</h1>
      <p class="pin-gate-label">Enter PIN</p>
      <input id="pinInput" class="pin-gate-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
      <button id="pinSubmitBtn" class="pin-gate-btn">UNLOCK</button>
      <p id="pinError" class="pin-gate-error"></p>
    </div>
  </div>

  <div class="app-frame">

  <div class="top-bar">
    <div class="logo">
      <img src="./assets/logo.svg" alt="Twoworking Studio logo" width="52" height="64" style="display:block; width:100%; height:auto;">
    </div>
  </div>

  <div class="page">
    <div class="goal-card">
      <div class="goal-divider"></div>
      <div class="goal-card-inner">
        <div class="goal-header">
          <h1 class="display goal-title">AUGUST GOAL:</h1>
        </div>
        <div class="goal-amount-row">
          <p class="goal-amount" id="goalAmountText">Earn 1 Lakh rupees</p>
          <button class="goal-edit-btn" id="goalEditBtn" aria-label="Edit monthly goal">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.3 1.7a1 1 0 0 1 1.4 0l1.6 1.6a1 1 0 0 1 0 1.4L5.4 13.6l-3.4.8.8-3.4L11.3 1.7Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
          </button>
          <input class="goal-amount-input" id="goalAmountInput" type="text" hidden>
        </div>
        <div class="goal-progress" id="goalProgress"></div>
      </div>
      <div class="goal-divider"></div>
    </div>

    <div class="people-list">

      <div class="person-card">
        <button class="person-card-header" data-person="nabh">
          <h2 class="display person-name">NABH</h2>
          <span class="chevron">
            <svg width="20" height="38" viewBox="0 0 20 38" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0.530273 36.5303L18.5303 18.5303L0.530272 0.530329" stroke="#19FF55" stroke-width="1.5"/>
            </svg>
          </span>
        </button>
        <div class="streak-grid" data-streak="nabh"></div>
        <p class="person-status" data-status="nabh"></p>
      </div>

      <div class="person-card">
        <button class="person-card-header" data-person="avi">
          <h2 class="display person-name">AVI</h2>
          <span class="chevron">
            <svg width="20" height="38" viewBox="0 0 20 38" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0.530273 36.5303L18.5303 18.5303L0.530272 0.530329" stroke="#19FF55" stroke-width="1.5"/>
            </svg>
          </span>
        </button>
        <div class="streak-grid" data-streak="avi"></div>
        <p class="person-status" data-status="avi"></p>
      </div>

      <div class="person-card">
        <button class="person-card-header" data-person="adi">
          <h2 class="display person-name">ADI</h2>
          <span class="chevron">
            <svg width="20" height="38" viewBox="0 0 20 38" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0.530273 36.5303L18.5303 18.5303L0.530272 0.530329" stroke="#19FF55" stroke-width="1.5"/>
            </svg>
          </span>
        </button>
        <div class="streak-grid" data-streak="adi"></div>
        <p class="person-status" data-status="adi"></p>
      </div>

    </div>
  </div>

  </div><!-- /.app-frame -->

  <!-- Firebase: real shared database. `defer` lets the page's HTML/CSS
       finish loading and paint immediately, instead of the browser
       stopping to download these before showing anything — this is the
       main reason the page used to feel slow to open. -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="./firebase-config.js"></script>
  <script defer src="./auth-gate.js"></script>

  <script defer src="./index.js"></script>
  <!-- Auto-update: this page checks every 30s whether a new version has
       been pushed and reloads itself automatically if so — nobody has to
       remember to hard-refresh. See update-checker.js. -->
  <script>window.APP_VERSION = 2;</script>
  <script defer src="./update-checker.js"></script>

</body>
</html>
